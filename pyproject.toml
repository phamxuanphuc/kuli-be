[project]
name = "python-rest-api"
version = "0.1.0"
description = "Minimal Python REST API using FastAPI"
requires-python = ">=3.10"
dependencies = [
    "certifi>=2024.0.0",
    "fastapi>=0.115.0",
    "markitdown>=0.1.0",
    "moonshine-voice>=0.0.63",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
